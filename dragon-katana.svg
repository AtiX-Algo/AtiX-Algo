<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="62%" cy="48%" r="85%">
      <stop offset="0%" stop-color="#2a0000"/>
      <stop offset="55%" stop-color="#0a0000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="dragonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d0000"/>
      <stop offset="50%" stop-color="#ff1e1e"/>
      <stop offset="100%" stop-color="#ff8a00"/>
    </linearGradient>

    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8d8d8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9a9a9a"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bgGlow)"/>

  <!-- faint scanlines for a screen/anime-panel feel -->
  <g opacity="0.06">
    <line x1="0" y1="30" x2="1200" y2="30" stroke="#ff1e1e" stroke-width="1"/>
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#ff1e1e" stroke-width="1"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#ff1e1e" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#ff1e1e" stroke-width="1"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#ff1e1e" stroke-width="1"/>
  </g>

  <!-- ===== DRAGON ===== -->
  <g transform="translate(0,55)">
  <path d="M50,260 C110,220 80,150 150,130 C220,110 180,55 250,45
           C300,38 290,10 350,15 C395,18 415,-8 460,3"
        fill="none" stroke="url(#dragonGrad)" stroke-width="12"
        stroke-linecap="round" filter="url(#glow)" opacity="0.92">
    <animate attributeName="stroke-width" values="10;15;10" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <!-- dorsal spikes -->
  <g stroke="url(#dragonGrad)" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)">
    <path d="M145,140 L162,105"/>
    <path d="M205,90 L222,55"/>
    <path d="M275,50 L290,18"/>
    <path d="M345,20 L358,-12"/>
  </g>

  <!-- head -->
  <path d="M460,3 C482,-15 512,-20 535,-2 C525,16 502,22 485,34
           C472,26 464,15 460,3 Z"
        fill="url(#dragonGrad)" filter="url(#glow)"/>
  <!-- horn -->
  <path d="M515,-12 L533,-42 L525,-10 Z" fill="url(#dragonGrad)"/>
  <!-- jaw line -->
  <path d="M485,34 C500,42 515,40 528,28" fill="none" stroke="#3d0000" stroke-width="3" opacity="0.7"/>
  <!-- eye -->
  <circle cx="503" cy="0" r="4.5" fill="#fff45c">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <!-- whiskers -->
  <path d="M533,-4 C555,-10 570,-2 588,-12" stroke="url(#dragonGrad)" stroke-width="2" fill="none" opacity="0.85"/>
  <path d="M528,10 C548,10 560,20 578,16" stroke="url(#dragonGrad)" stroke-width="2" fill="none" opacity="0.7"/>
  </g>

  <!-- ===== KATANA ===== -->
  <g transform="rotate(-22 780 195)">
    <!-- blade -->
    <rect x="560" y="190" width="420" height="9" rx="3.5" fill="url(#bladeGrad)" filter="url(#softGlow)"/>
    <!-- edge line -->
    <rect x="560" y="197" width="420" height="1.5" fill="#ff1e1e" opacity="0.6"/>
    <!-- shine sweep -->
    <rect x="560" y="190" width="46" height="9" fill="#ffffff" opacity="0.95">
      <animate attributeName="x" values="560;934;560" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <!-- guard (tsuba) -->
    <circle cx="552" cy="194" r="15" fill="#0a0a0a" stroke="#ff1e1e" stroke-width="2.5" filter="url(#softGlow)"/>
    <!-- hilt (tsuka) -->
    <rect x="495" y="187" width="60" height="13" rx="4" fill="#0a0a0a" stroke="#ff1e1e" stroke-width="1.5"/>
    <line x1="505" y1="187" x2="512" y2="200" stroke="#ff1e1e" stroke-width="1" opacity="0.6"/>
    <line x1="520" y1="187" x2="527" y2="200" stroke="#ff1e1e" stroke-width="1" opacity="0.6"/>
    <line x1="535" y1="187" x2="542" y2="200" stroke="#ff1e1e" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- slash trail arc -->
  <path d="M600,280 A260,260 0 0,1 900,80" stroke="#ff1e1e" stroke-width="3"
        fill="none" stroke-dasharray="14 12" filter="url(#softGlow)" opacity="0.75">
    <animate attributeName="stroke-dashoffset" values="0;-260" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- ===== EMBERS ===== -->
  <g fill="#ff4d00" filter="url(#softGlow)">
    <circle cx="120" cy="270" r="3">
      <animate attributeName="cy" values="270;10" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="290" r="2.5">
      <animate attributeName="cy" values="290;30" dur="5.2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="5.2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="275" r="2">
      <animate attributeName="cy" values="275;20" dur="4.7s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="4.7s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="230" r="2.5">
      <animate attributeName="cy" values="230;5" dur="5.8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="5.8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="250" r="2">
      <animate attributeName="cy" values="250;15" dur="4.3s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="4.3s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="260" r="2.5">
      <animate attributeName="cy" values="260;30" dur="5.4s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="5.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- vignette -->
  <rect width="1200" height="300" fill="url(#bgGlow)" opacity="0" />
  <rect width="1200" height="300" fill="black" opacity="0.12"/>

  <!-- seal / monogram -->
  <g transform="translate(1120,55)">
    <circle r="32" fill="none" stroke="#ff1e1e" stroke-width="3" filter="url(#softGlow)">
      <animate attributeName="r" values="30;34;30" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="30" fill="#ff1e1e" font-weight="bold">A</text>
  </g>
</svg>
