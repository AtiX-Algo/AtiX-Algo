<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30,0 L0,0 L0,30" fill="none" stroke="#ff1e1e" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1e1e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff1e1e" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="620" height="300" fill="#050000"/>
  <rect width="620" height="300" fill="url(#grid)" opacity="0.12"/>

  <!-- status line -->
  <circle cx="20" cy="34" r="4" fill="#ff1e1e">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="34" y="39" font-family="'Courier New',monospace" font-size="14" fill="#ff1e1e" letter-spacing="2">SYSTEM ONLINE</text>

  <!-- glitch title -->
  <g>
    <text x="18" y="140" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900"
          fill="#00eaff" opacity="0.55" letter-spacing="1">
      CYBER<tspan fill="#00eaff">PUNK</tspan>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -3,1; 2,-1; 0,0; 1,1; 0,0" dur="3.4s" repeatCount="indefinite"/>
    </text>
    <text x="22" y="142" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900"
          fill="#ff1e1e" opacity="0.55" letter-spacing="1">
      CYBERPUNK
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 3,-1; -2,1; 0,0; -1,-1; 0,0" dur="3.1s" repeatCount="indefinite"/>
    </text>
    <text x="20" y="141" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900"
          fill="#f5f5f5" letter-spacing="1">CYBER<tspan fill="#ff1e1e">PUNK</tspan></text>
    <text x="20" y="190" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900"
          fill="#ff1e1e" letter-spacing="1" filter="url(#softGlow)">-DEV</text>
  </g>

  <!-- subtitle -->
  <text x="20" y="230" font-family="'Courier New',monospace" font-size="20" fill="#e5e5e5" letter-spacing="1">
    &gt; FUTURE IS CODE<tspan fill="#ff1e1e">_</tspan>
  </text>
  <rect x="245" y="216" width="11" height="18" fill="#ff1e1e">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- scanline sweep -->
  <rect x="0" y="0" width="620" height="2" fill="url(#edgeFade)" opacity="0.4">
    <animate attributeName="y" values="0;300;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- corner radar -->
  <g transform="translate(560,255)" opacity="0.85">
    <circle r="30" fill="none" stroke="#ff1e1e" stroke-width="1.5" opacity="0.5"/>
    <circle r="18" fill="none" stroke="#ff1e1e" stroke-width="1" opacity="0.4"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#ff1e1e" stroke-width="0.6" opacity="0.35"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#ff1e1e" stroke-width="0.6" opacity="0.35"/>
    <g>
      <path d="M0,0 L0,-30 A30,30 0 0,1 26,-15 Z" fill="#ff1e1e" opacity="0.35"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.5s" repeatCount="indefinite"/>
    </g>
    <circle r="3" fill="#ff1e1e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- bottom border -->
  <rect x="0" y="298" width="620" height="2" fill="#ff1e1e" opacity="0.6"/>
</svg>
