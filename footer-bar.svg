<svg viewBox="0 0 620 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d0000"/>
      <stop offset="100%" stop-color="#ff1e1e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="620" height="40" fill="#050000"/>
  <text x="10" y="16" font-family="'Courier New',monospace" font-size="12" fill="#e5e5e5" letter-spacing="1">
    &gt; INITIALIZING GREATNESS...
  </text>
  <text x="610" y="16" font-family="'Courier New',monospace" font-size="12" fill="#ff1e1e" text-anchor="end">99%</text>
  <rect x="10" y="24" width="600" height="8" rx="4" fill="#1a0000"/>
  <rect x="10" y="24" width="0" height="8" rx="4" fill="url(#barFill)" filter="url(#glow)">
    <animate attributeName="width" from="0" to="594" dur="2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="2.2s" begin="2s" repeatCount="indefinite"/>
  </rect>
</svg>
