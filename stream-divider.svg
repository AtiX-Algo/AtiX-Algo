<svg viewBox="0 0 1200 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e1e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff1e1e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff1e1e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="16" fill="#000000"/>
  <rect x="0" y="7" width="1200" height="2" fill="url(#lineFade)"/>
  <g fill="#ff1e1e">
    <rect x="-20" y="5" width="14" height="6">
      <animate attributeName="x" from="-20" to="1220" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-20" y="5" width="8" height="6" opacity="0.7">
      <animate attributeName="x" from="-20" to="1220" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="-20" y="5" width="20" height="6" opacity="0.5">
      <animate attributeName="x" from="-20" to="1220" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="-20" y="5" width="10" height="6" opacity="0.8">
      <animate attributeName="x" from="-20" to="1220" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
